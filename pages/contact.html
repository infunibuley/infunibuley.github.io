<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600&family=Barrio&family=Barriecito&display=swap" rel="stylesheet">  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://infunibuley.github.io/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>infunibuley</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <script src="../scripts/forms.js" defer></script>
  <script src="../scripts/load-layout.js" defer></script>
  <link rel="icon" type="image/png" href="https://infunibuley.github.io/assets/favicon.png">
</head>

<body>
<div>
  <div id="site-header"></div>

  <div class="flex-container">
    <h2>Contact</h2>
  </div>

  <div class="flex-container">
    <form data-survey-form class="suggestion-box">
      <input type="hidden" name="sheet_name" value="suggestions">
      <h3>Suggestions</h3>
      <h3>let me borrow your mind</h3>
      <p>Please do not share any personal information (such as email, location, full name, birthdate, etc.) if you are under the age of 13.<br><br></p>

      <div class="form-group">
        <label for="alias">Alias*:</label>
        <input type="text" id="alias" name="alias" required placeholder="who am I crediting for this">
      </div>

      <div class="form-group">
        <label for="email">Email: (optional)</label>
        <input type="email" id="email" name="email" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="instagram">Instagram: (optional)</label>
        <input type="text" id="instagram" name="instagram" placeholder="@username">
      </div>

      <div class="form-group">
        <label for="substack">Substack: (optional)</label>
        <input type="text" id="substack" name="substack" placeholder="yourname.substack.com">
      </div>

      <div class="form-group">
        <label for="project">Project:</label>
        <input type="text" id="project" name="project" placeholder="is this for a specific project? If yes, pls lmk">
      </div>

      <div class="form-group">
        <label for="suggestion">Suggestion*:</label>
        <textarea id="suggestion" name="suggestion" rows="4" required placeholder="What's on your mind?"></textarea>
      </div>

      <input type="hidden" name="redirect" value="https://infunibuley.github.io/">

      <button type="submit" class="submit-btn">Submit</button>
      <p class="form-status" style="display: none; text-align: center; margin-top: 10px;"></p>
      <p><br>You may also contact me at <a href="mailto:infunibuley@proton.me"><u>infunibuley@proton.me</u></a>. <br>I kind of don't check anything else</p>
    </form>
  </div>

<div id="site-footer"></div>

</div>

</body>
</html>
