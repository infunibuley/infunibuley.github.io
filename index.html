<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600&family=Barrio&family=Barriecito&display=swap" rel="stylesheet">  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>infunibuley</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<div>

  <header class="header">
    <h1> <a href="https://infunibuley.github.io/">infunibuley</a> </h1>
    <div class="flex-container">
      <div class="text-block">
        <h3> <a href="https://infunibuley.github.io/pages/projects">Projects</a> </h3>
      </div>
      <div class="text-block">
        <h3> <a href="https://infunibuley.github.io/pages/about">About</a> </h3>
      </div>
      <div class="text-block">
        <h3> <a href="https://infunibuley.github.io/pages/surveys">Surveys</a> </h3>
      </div>
    </div>
  </header>

  <div class="flex-container">
    <div class="update">
      <p>Latest Update</p>
      <h3>Pseudo Project</h3>
      <span class="tag">Stage: mind works</span>
    </div>

    <div class="update">
      <p>Latest Survey</p>
      <h3>Pseudo Survey</h3>
      <span class="tag">Stage: mind works</span>
    </div> 
  </div>
    
  <div class="flex-container">
    <form action="https://api.web3forms.com/submit" method="POST" class="suggestion-box">
      <input type="hidden" name="access_key" value="f81b78bd-c568-4c0d-9311-ae6be4d0b9ed">
      <input type="hidden" name="subject" value="New Thought / Suggestion for infunibuley">

      <input type="checkbox" name="botcheck" style="display: none;">

      <h3>Suggestions</h3>
      <h3>let me borrow your mind</h3>

      <div class="form-group">
        <label for="alias">Alias:</label>
        <input type="text" id="alias" name="alias" required placeholder="who am I crediting for this">
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="instagram">Instagram:</label>
        <input type="text" id="instagram" name="instagram" placeholder="@username">
      </div>

      <div class="form-group">
        <label for="substack">Substack:</label>
        <input type="text" id="substack" name="substack" placeholder="yourname.substack.com">
      </div>

      <div class="form-group">
        <label for="project">Project:</label>
        <input type="text" id="project" name="project" placeholder="is this for a specific project? If yes, pls lmk">
      </div>

      <div class="form-group">
        <label for="suggestion">Suggestion*:</label>
        <textarea id="suggestion" name="suggestion" rows="4" required placeholder="What's on your mind?"></textarea>
      </div>

      <input type="hidden" name="redirect" value="https://infunibuley.github.io/">

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <a href="mailto:infunibuley@proton.me" target="_blank">Contact</a>
      <a href="https://instagram.com/infunibuley" target="_blank">Instagram</a>
      <a href="https://substack.com/@infunibuley" target="_blank">Substack</a>
      <a href="https://github.com/infunibuley" target="_blank">GitHub</a>
    </div>
  </footer>

</div>

</body>
</html>
