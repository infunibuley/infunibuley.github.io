<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>infunibuley</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    header {
      padding: 2rem 5%;
      border-bottom: 1px solid var(--border);
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
    }

    .latest-update {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: right;
    }

    .latest-update a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .latest-update a:hover {
      text-decoration: underline;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .intro {
      margin-bottom: 2.5rem;
      color: var(--muted);
      font-size: 1.15rem;
      max-width: 600px;
    }

    .button-group {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--bg);
      background-color: var(--accent);
      border-radius: 8px;
      transition: all 0.2s ease;
      min-width: 150px;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 2px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--card-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    footer {
      padding: 2rem 5%;
      border-top: 1px solid var(--border);
      background-color: rgba(15, 23, 42, 0.6);
    }

    .footer-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .social-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      list-style: none;
    }

    .social-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .social-links a:hover {
      color: var(--accent);
    }

    .copyright {
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <a href="/" class="brand">infunibuley</a>
      <div class="latest-update">
        Latest update: <a href="projects/food-culture.html">Food & Culture Survey</a> (08/19/2026)
      </div>
    </div>
  </header>

  <main>
    <p class="intro">
      Exploring culture, misinformation, and community trends through data science and open surveys.
    </p>
    <div class="button-group">
      <a href="projects.html" class="btn">Projects</a>
      <a href="surveys.html" class="btn btn-secondary">Surveys</a>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <ul class="social-links">
        <li><a href="mailto:your-email@domain.com">Email</a></li>
        <li><a href="https://instagram.com/yourhandle" target="_blank" rel="noopener noreferrer">Instagram</a></li>
        <li><a href="https://youtube.com/@yourhandle" target="_blank" rel="noopener noreferrer">YouTube</a></li>
        <li><a href="https://yourhandle.substack.com" target="_blank" rel="noopener noreferrer">Substack</a></li>
      </ul>
      <p class="copyright">&copy; 2026 infunibuley. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
