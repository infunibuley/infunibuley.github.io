<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css?family=Barrio" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Barriecito" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>infunibuley</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<div>

  <header class="header">
    <h1> <a href="https://infunibuley.github.io/">infunibuley</a> </h1>
    <div class="flex-container">
      <div class="text-block">
        <h3>Projects</h3>
      </div>
      <div class="text-block">
        <h3> <a href="https://infunibuley.github.io/pages/about">About</a> </h3>
      </div>
      <div class="text-block">
        <h3>Surveys</h3>
      </div>
    </div>
  </header>

  <div class="flex-container">
    <div class="update">
      <p>Latest Update</p>
      <h3>Pseudo Project</h3>
      <span class="tag">Stage: mind works</span>
    </div>

    <div class="update">
      <p>Latest Survey</p>
      <h3>Pseudo Survey</h3>
      <span class="tag">Stage: mind works</span>
    </div> 
  </div>
    
  <div class="flex-container">
    <form class="suggestion-box">
      <h3>Suggestions</h3>
      <h3>let me borrow your mind</h3>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="instagram">Instagram:</label>
        <input type="text" id="instagram" name="instagram" placeholder="@username">
      </div>

      <div class="form-group">
        <label for="substack">Substack:</label>
        <input type="text" id="substack" name="substack" placeholder="yourname.substack.com">
      </div>

      <div class="form-group">
        <label for="suggestion">Suggestion*:</label>
        <textarea id="suggestion" name="suggestion" rows="4" required placeholder="What's on your mind?"></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <a href="mailto:your@email.com" target="_blank">Contact</a>
      <a href="https://instagram.com/yourhandle" target="_blank">Instagram</a>
      <a href="https://yourname.substack.com" target="_blank">Substack</a>
      <a href="https://github.com/yourhandle" target="_blank">GitHub</a>
    </div>
  </footer>

</div>

</body>
</html>
